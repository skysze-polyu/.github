name: Relay Chain — action → issue → pr → label → update

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # 第1棒 action：dispatch 建立 issue，貼 @relay-issue
  fire_action:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: 建立 relay issue 並點第一棒
        env:
          GH_TOKEN: ${{ secrets.RELAY_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          URL=$(gh issue create --repo "$REPO" \
            --title "Relay chain test — $(date -u +%H%M%S)" \
            --body "Relay chain 自動化測試。請勿手動關閉。")
          NUM=$(echo "$URL" | grep -oE '[0-9]+$')
          echo "issue=$NUM"
          gh issue comment "$NUM" --repo "$REPO" \
            --body "@relay-issue 第1棒完成，交給 issue 棒開 branch/PR。"
          echo "RELAY_ISSUE=$NUM" >> "$GITHUB_ENV"

  # 第2棒 issue：收到 @relay-issue → 開 branch/commit/PR → 貼 @relay-pr
  handle_issue:
    if: >-
      github.event_name == 'issue_comment' &&
      contains(github.event.comment.body, '@relay-issue')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 開 branch、commit、PR
        env:
          GH_TOKEN: ${{ secrets.RELAY_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          git config user.name "relay-bot"
          git config user.email "relay-bot@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          BRANCH="relay/auto-$(date -u +%H%M%S)"
          git checkout -b "$BRANCH"
          echo "relay artifact $(date -u)" > relay-artifact.txt
          git add relay-artifact.txt
          git commit -m "relay: issue 棒產生的這種 commit"
          git push -u origin "$BRANCH"
          gh pr create --repo "$REPO" --base main --head "$BRANCH" \
            --title "Relay PR from issue #$ISSUE" \
            --body "由 @relay-issue 棒自動建立。Ref #$ISSUE" > /dev/null
          gh issue comment "$ISSUE" --repo "$REPO" \
            --body "@relay-pr 第2棒完成，PR 已開，交給 pr 棒。"

  # 第3棒 pr：收到 @relay-pr → 加 label → 貼 @relay-label
  handle_pr:
    if: >-
      github.event_name == 'issue_comment' &&
      contains(github.event.comment.body, '@relay-pr')
    runs-on: ubuntu-latest
    steps:
      - name: 加 relay:review label
        env:
          GH_TOKEN: ${{ secrets.RELAY_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh label create "relay:review" --repo "$REPO" --color fbca04 \
            --description "relay Chain review" 2>/dev/null || true
          PR=$(gh pr list --repo "$REPO" --head "$(git ls-remote --heads origin 'refs/heads/relay/*' | tail -1 | sed 's|.*refs/heads/||')" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$PR" ]; then
            PR=$(gh pr list --repo "$REPO" --state open --json number --jq '.[0].number')
          fi
          echo "PR=$PR"
          gh pr edit "$PR" --repo "$REPO" --add-label "relay:review"
          gh issue comment "$ISSUE" --repo "$REPO" \
            --body "@relay-label 第3棒完成，label 已加，交給 label 棒。"

  # 第4棒 label：收到 @relay-label → 更新 PR（review comment + body）→ 貼 @relay-update
  handle_label:
    if: >-
      github.event_name == 'issue_comment' &&
      contains(github.event.comment.body, '@relay-label')
    runs-on: ubuntu-latest
    steps:
      - name: 更新 PR 內容
        env:
          GH_TOKEN: ${{ secrets.RELAY_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          PR=$(gh pr list --repo "$REPO" --state open --json number --jq '.[0].number')
          echo "PR=$PR"
          gh pr comment "$PR" --repo "$REPO" \
            --body "relay label 棒審查：內容符合，允許更新。"
          gh pr edit "$PR" --repo "$REPO" \
            --body "由 @relay-label 棒更新。Ref #$ISSUE — 接力鏈即在 label 棒做更新。"
          gh issue comment "$ISSUE" --repo "$REPO" \
            --body "@relay-update 第4棒完成，PR 已更新，交給 update 棒收尾。"

  # 第5棒 update：收到 @relay-update → 標記 done、貼完成、關閉 issue
  handle_update:
    if: >-
      github.event_name == 'issue_comment' &&
      contains(github.event.comment.body, '@relay-update')
    runs-on: ubuntu-latest
    steps:
      - name: 收尾
        env:
          GH_TOKEN: ${{ secrets.RELAY_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh label create "relay:done" --repo "$REPO" --color 0e8a16 \
            --description "relay  Chain done" 2>/dev/null || true
          gh issue edit "$ISSUE" --repo "$REPO" --add-label "relay:done"
          gh issue comment "$ISSUE" --repo "$REPO" \
            --body "✅ Relay chain 完成：action → issue → pr → label → update 五棒全數跑完。"
          gh issue close "$ISSUE" --repo "$REPO"
          echo "relay chain finished for issue #$ISSUE"
